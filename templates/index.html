{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<section class="intro">
  <div class="intro-text">
    <h1>Student Main Portal</h1>
    <p class="tagline">
      Unlock your student portal registration - join us today for
      your online courses.
    </p>

</section>
{% endblock %}
